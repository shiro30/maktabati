<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    // ============================================
    // إعداد Supabase
    // ============================================

    const SUPABASE_URL =
        "https://xdkluojrvdhdtihblpwy.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_znxrXQ3DJxs8D5O--_TCcQ_6tXDfpFK";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    // ============================================
    // عناصر الصفحة
    // ============================================

    const usersTableBody =
        document.getElementById("usersTableBody");

    const createUserForm =
        document.getElementById("createUserForm");

    const createMessage =
        document.getElementById("createMessage");

    const refreshBtn =
        document.getElementById("refreshBtn");

    const editModal =
        document.getElementById("editModal");

    const editUserForm =
        document.getElementById("editUserForm");

    const editMessage =
        document.getElementById("editMessage");

    const backBtn =
        document.getElementById("backBtn");


    // ============================================
    // أسماء أنواع الحسابات
    // ============================================

    const roleNames = {

        programmer: "مبرمج",

        admin: "مدير",

        teacher: "أستاذ",

        student: "تلميذ"

    };


    // ============================================
    // التحقق من المبرمج أو المدير
    // ============================================

    async function checkAccountManager() {

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        if (!user) {

            window.location.href = "login.html";

            return false;

        }


        const {
            data: profile,
            error
        } = await supabaseClient

            .from("profiles")

            .select("role, full_name")

            .eq("id", user.id)

            .single();


        if (error || !profile) {

            document.body.innerHTML = `

                <div style="
                    text-align:center;
                    margin-top:100px;
                    font-family:Cairo,sans-serif;
                ">

                    <h1>
                        🚫 غير مصرح
                    </h1>

                    <p>
                        لم يتم العثور على بيانات الحساب.
                    </p>

                </div>

            `;

            return false;

        }


        // المسموح لهم بالدخول:
        // المبرمج + المدير

        if (
            profile.role !== "programmer" &&
            profile.role !== "admin"
        ) {

            document.body.innerHTML = `

                <div style="
                    text-align:center;
                    margin-top:100px;
                    font-family:Cairo,sans-serif;
                ">

                    <h1>
                        🚫 غير مصرح
                    </h1>

                    <p>
                        ليس لديك صلاحية للوصول إلى إدارة الحسابات.
                    </p>

                </div>

            `;

            return false;

        }


        // تغيير زر العودة حسب نوع الحساب

        if (profile.role === "programmer") {

            backBtn.href = "programmer.html";

            backBtn.textContent =
                "العودة إلى لوحة المبرمج";

        } else {

            backBtn.href = "admin.html";

            backBtn.textContent =
                "العودة إلى لوحة المدير";

        }


        return true;

    }


    // ============================================
    // الحصول على Access Token
    // ============================================

    async function getAccessToken() {

        const {
            data
        } = await supabaseClient.auth.getSession();

        return data.session?.access_token;

    }


    // ============================================
    // عرض رسالة
    // ============================================

    function showMessage(
        element,
        message,
        type
    ) {

        element.textContent = message;

        element.className =
            "message " + type;

    }


    // ============================================
    // تحميل الحسابات
    // ============================================

    async function loadUsers() {

        usersTableBody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="loading">

                    جار تحميل الحسابات...

                </td>

            </tr>

        `;


        try {

            const token =
                await getAccessToken();


            if (!token) {

                window.location.href =
                    "login.html";

                return;

            }


            const response =
                await fetch(
                    "/api/admin/users",
                    {
                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "تعذر تحميل الحسابات."
                );

            }


            renderUsers(result.users);


        } catch (error) {

            console.error(error);

            usersTableBody.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="loading">

                        ❌ ${escapeHtml(error.message)}

                    </td>

                </tr>

            `;

        }

    }


    // ============================================
    // عرض الحسابات
    // ============================================

    function renderUsers(users) {

        if (!users || users.length === 0) {

            usersTableBody.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="loading">

                        لا توجد حسابات.

                    </td>

                </tr>

            `;

            return;

        }


        usersTableBody.innerHTML =

            users.map((user, index) => {

                const role =
                    user.role || "غير محدد";


                const roleClass =
                    role === "programmer"
                        ? "programmer"
                        : role;


                const date =
                    user.createdAt
                        ? new Date(
                            user.createdAt
                        ).toLocaleDateString(
                            "ar-DZ"
                        )
                        : "-";


                let actions = "";


                // المبرمج محمي دائما

                if (role === "programmer") {

                    actions = `

                        <span class="protected">

                            🔒 حساب محمي

                        </span>

                    `;

                } else {

                    actions = `

                        <div class="actions">

                            <button
                                class="action-btn edit-btn"
                                onclick='openEditModal(${JSON.stringify(user)})'>

                                ✏️ تعديل

                            </button>


                            <button
                                class="action-btn delete-btn"
                                onclick="deleteUser('${user.id}', '${escapeAttribute(user.fullName)}')">

                                🗑️ حذف

                            </button>

                        </div>

                    `;

                }


                return `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${escapeHtml(user.fullName)}
                        </td>

                        <td>
                            ${escapeHtml(user.email || "-")}
                        </td>

                        <td>

                            <span
                                class="badge ${roleClass}">

                                ${roleNames[role] || role}

                            </span>

                        </td>

                        <td>
                            ${date}
                        </td>

                        <td>

                            <span class="status">
                                ● نشط
                            </span>

                        </td>

                        <td>
                            ${actions}
                        </td>

                    </tr>

                `;

            }).join("");

    }


    // ============================================
    // إنشاء حساب
    // ============================================

    createUserForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            createMessage.className =
                "message";

            createMessage.textContent = "";


            const fullName =
                document.getElementById(
                    "fullName"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const role =
                document.getElementById(
                    "role"
                ).value;


            try {

                const token =
                    await getAccessToken();


                if (!token) {

                    throw new Error(
                        "انتهت جلسة تسجيل الدخول."
                    );

                }


                const response =
                    await fetch(
                        "/api/admin/create-user",
                        {
                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token

                            },

                            body: JSON.stringify({

                                fullName,
                                email,
                                password,
                                role

                            })

                        }
                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "فشل إنشاء الحساب."
                    );

                }


                showMessage(
                    createMessage,
                    "✅ تم إنشاء الحساب بنجاح.",
                    "success"
                );


                createUserForm.reset();


                await loadUsers();


            } catch (error) {

                console.error(error);

                showMessage(
                    createMessage,
                    "❌ " + error.message,
                    "error"
                );

            }

        }
    );


    // ============================================
    // فتح نافذة التعديل
    // ============================================

    function openEditModal(user) {

        // منع تعديل حساب المبرمج

        if (user.role === "programmer") {

            alert(
                "🔒 لا يمكن تعديل حساب المبرمج."
            );

            return;

        }


        document.getElementById(
            "editUserId"
        ).value = user.id;


        document.getElementById(
            "editFullName"
        ).value = user.fullName || "";


        document.getElementById(
            "editEmail"
        ).value = user.email || "";


        document.getElementById(
            "editPassword"
        ).value = "";


        document.getElementById(
            "editRole"
        ).value =

            [
                "admin",
                "teacher",
                "student"
            ].includes(user.role)

                ? user.role

                : "student";


        editMessage.className =
            "message";

        editMessage.textContent = "";


        editModal.classList.add("show");

    }


    // ============================================
    // إغلاق نافذة التعديل
    // ============================================

    function closeEditModal() {

        editModal.classList.remove("show");

    }


    document.getElementById(
        "closeModalBtn"
    ).addEventListener(
        "click",
        closeEditModal
    );


    document.getElementById(
        "cancelEditBtn"
    ).addEventListener(
        "click",
        closeEditModal
    );


    editModal.addEventListener(
        "click",
        function(event) {

            if (
                event.target === editModal
            ) {

                closeEditModal();

            }

        }
    );


    // ============================================
    // حفظ تعديل الحساب
    // ============================================

    editUserForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            editMessage.className =
                "message";


            const userId =
                document.getElementById(
                    "editUserId"
                ).value;


            const fullName =
                document.getElementById(
                    "editFullName"
                ).value.trim();


            const email =
                document.getElementById(
                    "editEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "editPassword"
                ).value;


            const role =
                document.getElementById(
                    "editRole"
                ).value;


            try {

                const token =
                    await getAccessToken();


                if (!token) {

                    throw new Error(
                        "انتهت جلسة تسجيل الدخول."
                    );

                }


                const response =
                    await fetch(

                        "/api/admin/users/" +
                        encodeURIComponent(userId),

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token

                            },

                            body: JSON.stringify({

                                fullName,
                                email,
                                password,
                                role

                            })

                        }

                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "فشل تعديل الحساب."
                    );

                }


                showMessage(
                    editMessage,
                    "✅ تم تعديل الحساب بنجاح.",
                    "success"
                );


                await loadUsers();


                setTimeout(
                    closeEditModal,
                    700
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    editMessage,
                    "❌ " + error.message,
                    "error"
                );

            }

        }
    );


    // ============================================
    // حذف حساب
    // ============================================

    async function deleteUser(
        userId,
        userName
    ) {

        const confirmed =
            confirm(

                "هل أنت متأكد من حذف الحساب:\n\n" +

                userName +

                "\n\nلا يمكن التراجع عن هذه العملية."

            );


        if (!confirmed) {

            return;

        }


        try {

            const token =
                await getAccessToken();


            if (!token) {

                throw new Error(
                    "انتهت جلسة تسجيل الدخول."
                );

            }


            const response =
                await fetch(

                    "/api/admin/users/" +
                    encodeURIComponent(userId),

                    {

                        method: "DELETE",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    }

                );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "فشل حذف الحساب."
                );

            }


            alert(
                "✅ تم حذف الحساب بنجاح."
            );


            await loadUsers();


        } catch (error) {

            console.error(error);

            alert(
                "❌ " + error.message
            );

        }

    }


    // ============================================
    // تحديث القائمة
    // ============================================

    refreshBtn.addEventListener(
        "click",
        loadUsers
    );


    // ============================================
    // حماية HTML
    // ============================================

    function escapeHtml(value) {

        return String(value ?? "")

            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

        return String(value ?? "")

            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/"/g, "&quot;")
            .replace(/\n/g, " ");

    }


    // ============================================
    // تشغيل الصفحة
    // ============================================

    async function initializePage() {

        const allowed =
            await checkAccountManager();


        if (!allowed) {

            return;

        }


        await loadUsers();

    }


    initializePage();

</script>
