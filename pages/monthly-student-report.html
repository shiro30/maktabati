<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>التقرير الشهري | مكتبتي</title><link rel="stylesheet" href="../style.css"><style>
body{font-family:Cairo,Arial,sans-serif;background:#030712;color:#f8fafc}.report-wrap{width:92%;max-width:1200px;margin:35px auto}.report-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;background:#081b36;border:1px solid #1b3658;border-radius:16px;padding:20px}.report-head h1{margin:0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls input,.controls button{font-family:inherit;border-radius:9px;padding:10px 13px;border:1px solid #27466b}.controls input{background:#fff;color:#111}.controls button{background:#ff7a18;color:#111827;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px 0}.statbox{background:#0a1728;border:1px solid #1b3658;border-radius:14px;padding:18px}.statbox strong{display:block;font-size:27px;color:#ff9a3d}.table-wrap{overflow:auto;background:#07101d;border:1px solid #1b3658;border-radius:16px}.report-table{width:100%;border-collapse:collapse;min-width:800px}.report-table th,.report-table td{padding:12px;border-bottom:1px solid #172b46;text-align:right}.report-table th{background:#0d1c30;color:#ffb066}.report-table td{color:#dbeafe}.back{display:inline-block;margin-bottom:15px;color:#ff9a3d;text-decoration:none}.print-note{text-align:center;color:#94a3b8;margin-top:15px;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#111}.report-head,.statbox,.table-wrap{border:1px solid #bbb;background:#fff;color:#111}.report-head p,.print-note{color:#444}.controls,.back{display:none}.report-table th{background:#eee;color:#111}.report-table td,.report-table th{color:#111}.report-wrap{width:100%;margin:0}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="report-wrap"><a class="back" href="javascript:history.back()">← العودة</a><section class="report-head"><div><h1>📊 التقرير الشهري لدخول التلاميذ</h1><p id="reportTitle">جار التحميل...</p></div><div class="controls"><label for="month">الشهر:</label><input id="month" type="month"><button id="loadBtn">عرض التقرير</button><button id="printBtn">🖨️ طباعة</button><button id="csvBtn">📥 CSV</button></div></section><section class="stats"><div class="statbox"><span>التلاميذ الذين دخلوا</span><strong id="totalStudents">—</strong></div><div class="statbox"><span>إجمالي عمليات الدخول</span><strong id="totalLogins">—</strong></div></section><div class="table-wrap"><table class="report-table"><thead><tr><th>#</th><th>التلميذ</th><th>الشعبة</th><th>السنة</th><th>مرات الدخول</th><th>أول دخول</th><th>آخر دخول</th></tr></thead><tbody id="rows"><tr><td colspan="7">جار التحميل...</td></tr></tbody></table></div><div class="print-note">تقرير قابل للطباعة والاستخراج في أي وقت للشهر المحدد.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://xdkluojrvdhdtihblpwy.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_znxrXQ3DJxs8D5O--_TCcQ_6tXDfpFK';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const month=document.getElementById('month');const rows=document.getElementById('rows');let current=[];function fmt(x){return x?new Date(x).toLocaleString('ar-DZ'):''}function branch(x){return x==='scientific'?'علوم تجريبية':x==='literature'?'آداب وفلسفة':x==='management'?'تسيير واقتصاد':x||'—'}async function load(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='login.html';return}const r=await fetch('/api/admin/monthly-student-logins?month='+encodeURIComponent(month.value),{headers:{Authorization:'Bearer '+session.access_token}});const d=await r.json();if(!r.ok||!d.success){rows.innerHTML='<tr><td colspan="7">'+(d.message||'تعذر تحميل التقرير')+'</td></tr>';return}current=d.students||[];document.getElementById('reportTitle').textContent='شهر '+d.month;document.getElementById('totalStudents').textContent=d.totalStudents;document.getElementById('totalLogins').textContent=d.totalLogins;rows.innerHTML=current.length?current.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.full_name)}</td><td>${branch(s.branch)}</td><td>${esc(s.year)}</td><td>${s.login_count}</td><td>${fmt(s.first_login)}</td><td>${fmt(s.last_login)}</td></tr>`).join(''):'<tr><td colspan="7">لا توجد عمليات دخول لهذا الشهر.</td></tr>'}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function csv(){const lines=[['التلميذ','الشعبة','السنة','مرات الدخول','أول دخول','آخر دخول'],...current.map(s=>[s.full_name,branch(s.branch),s.year,s.login_count,fmt(s.first_login),fmt(s.last_login)])];const blob=new Blob(['\ufeff'+lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rapport-eleves-'+month.value+'.csv';a.click();URL.revokeObjectURL(a.href)}document.getElementById('loadBtn').onclick=load;document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('csvBtn').onclick=csv;month.value=new Date().toISOString().slice(0,7);load();
</script></body></html>
