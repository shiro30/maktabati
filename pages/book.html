<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل الكتاب | مكتبة الثانوية</title>
    <link rel="icon" type="image/png" href="../favicone.png">

    <link rel="stylesheet" href="../style.css">

    <style>
        .book-details-page {
            padding: 40px 20px;
            min-height: 70vh;
        }

        .book-details-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .book-details-card {
            background: #fff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
            align-items: start;
        }

        .book-cover-container {
            text-align: center;
        }

        .book-cover {
            width: 100%;
            max-width: 260px;
            height: 360px;
            object-fit: cover;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            background: #f5f5f5;
        }

        .book-info h1 {
            font-size: 32px;
            margin: 0 0 15px;
            color: #222;
        }

        .book-category {
            display: inline-block;
            background: #eef5ff;
            color: #2563eb;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .book-author {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }

        .book-description {
            color: #666;
            line-height: 1.9;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .book-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .meta-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 10px;
        }

        .meta-label {
            color: #888;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }

        .meta-value {
            color: #333;
            font-weight: 600;
        }

        .book-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .book-action-btn {
            border: none;
            border-radius: 10px;
            padding: 12px 22px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .book-action-btn:hover {
            transform: translateY(-2px);
        }

        .read-btn {
            background: #2563eb;
            color: white;
        }

        .read-btn:hover {
            background: #1d4ed8;
        }

        .download-btn {
            background: #16a34a;
            color: white;
        }

        .download-btn:hover {
            background: #15803d;
        }

        .back-btn {
            background: #f1f5f9;
            color: #334155;
        }

        .back-btn:hover {
            background: #e2e8f0;
        }

        .login-required {
            background: #fff7ed;
            color: #9a3412;
            padding: 15px 18px;
            border-radius: 10px;
            margin-top: 20px;
            line-height: 1.7;
        }

        .pdf-section {
            margin-top: 35px;
            display: none;
        }

        .pdf-reader-container {
            background: #1e1e1e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .pdf-toolbar {
            min-height: 60px;
            background: #292929;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 15px;
            flex-wrap: wrap;
        }

        .pdf-toolbar-left,
        .pdf-toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pdf-toolbar button {
            border: none;
            background: #3a3a3a;
            color: white;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .pdf-toolbar button:hover {
            background: #4a4a4a;
        }

        .pdf-progress-wrapper {
            flex: 1;
            min-width: 180px;
            max-width: 400px;
        }

        .pdf-progress {
            width: 100%;
            height: 6px;
            background: #444;
            border-radius: 20px;
            overflow: hidden;
        }

        .pdf-progress-bar {
            width: 0;
            height: 100%;
            background: #3b82f6;
            transition: width 0.2s ease;
        }

        .pdf-progress-text {
            font-size: 12px;
            color: #ccc;
            margin-top: 5px;
            text-align: center;
        }

        .pdf-pages {
            padding: 25px;
            min-height: 300px;
            background: #525252;
            overflow-x: auto;
        }

        .pdf-page {
            display: block;
            margin: 0 auto 25px;
            background: white;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            height: auto;
        }

        .pdf-loading {
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            color: white;
        }

        .pdf-loading-spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #555;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: pdfSpin 1s linear infinite;
        }

        @keyframes pdfSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .pdf-fullscreen-button {
            background: #3b82f6 !important;
        }

        .pdf-fullscreen-button:hover {
            background: #2563eb !important;
        }

        .pdf-reader-container:fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        .pdf-reader-container:fullscreen .pdf-pages {
            height: calc(100vh - 60px);
            overflow-y: auto;
        }

        .pdf-error {
            color: #fecaca;
            text-align: center;
            padding: 30px;
            line-height: 1.8;
        }

        @media (max-width: 800px) {
            .book-details-card {
                grid-template-columns: 1fr;
                padding: 25px 20px;
            }

            .book-cover-container {
                order: 0;
            }

            .book-info {
                order: 1;
            }

            .book-cover {
                height: 330px;
            }

            .book-info h1 {
                font-size: 26px;
            }

            .book-meta {
                grid-template-columns: 1fr;
            }

            .pdf-pages {
                padding: 10px;
            }

            .pdf-toolbar {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="navbar">
        <div class="nav-container">

            <a href="../index.html" class="logo">
                <span class="logo-icon">
                    <img src="../favicone.png" alt="شعار المكتبة">
                </span>
                <span>مكتبة الثانوية</span>
            </a>

            <nav class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="books.html" class="active">الكتب</a>
                <a href="categories.html">التصنيفات</a>
                <a href="about.html">حول المكتبة</a>
            </nav>

            <div class="nav-actions">
                <button
                    id="dashboardBack"
                    class="account-btn"
                    style="display:none;"
                    type="button">
                    لوحة التحكم
                </button>

                <button
                    id="loginButton"
                    class="account-btn"
                    type="button">
                    تسجيل الدخول
                </button>
            </div>

        </div>
    </header>

    <!-- Book Details -->
    <main class="book-details-page">
        <div class="book-details-container">

            <div id="bookDetailsCard" class="book-details-card">

                <div class="book-cover-container">
                    <img
                        id="bookCover"
                        class="book-cover"
                        src="../favicone.png"
                        alt="غلاف الكتاب">
                </div>

                <div class="book-info">

                    <span id="bookCategory" class="book-category">
                        جاري التحميل...
                    </span>

                    <h1 id="bookTitle">جاري تحميل الكتاب...</h1>

                    <div id="bookAuthor" class="book-author"></div>

                    <div id="bookDescription" class="book-description"></div>

                    <div id="bookMeta" class="book-meta"></div>

                    <div class="book-actions">

                        <button
                            id="readButton"
                            class="book-action-btn read-btn"
                            type="button"
                            style="display:none;">
                            📖 قراءة الكتاب
                        </button>

                        <button
                            id="downloadButton"
                            class="book-action-btn download-btn"
                            type="button"
                            style="display:none;">
                            ⬇️ تحميل الكتاب
                        </button>

                        <button
                            id="backButton"
                            class="book-action-btn back-btn"
                            type="button">
                            ← العودة إلى الكتب
                        </button>

                    </div>

                    <div
                        id="loginRequired"
                        class="login-required"
                        style="display:none;">
                        🔐 يجب تسجيل الدخول لقراءة أو تحميل الكتب.
                        <br>
                        <button
                            id="loginRequiredButton"
                            class="book-action-btn read-btn"
                            type="button"
                            style="margin-top:10px;">
                            تسجيل الدخول
                        </button>
                    </div>

                </div>
            </div>

            <!-- PDF Reader -->
            <section id="pdfSection" class="pdf-section">

                <div class="pdf-reader-container" id="pdfReaderContainer">

                    <div class="pdf-toolbar">

                        <div class="pdf-toolbar-left">

                            <button
                                id="closePdfButton"
                                type="button">
                                ✕ إغلاق
                            </button>

                            <span id="pdfPageInfo">
                                الصفحة 0 / 0
                            </span>

                        </div>

                        <div class="pdf-progress-wrapper">

                            <div class="pdf-progress">
                                <div
                                    id="pdfProgressBar"
                                    class="pdf-progress-bar">
                                </div>
                            </div>

                            <div
                                id="pdfProgressText"
                                class="pdf-progress-text">
                                جاري التحميل...
                            </div>

                        </div>

                        <div class="pdf-toolbar-right">

                            <button
                                id="fullscreenButton"
                                class="pdf-fullscreen-button"
                                type="button">
                                ⛶ ملء الشاشة
                            </button>

                        </div>

                    </div>

                    <div
                        id="pdfPages"
                        class="pdf-pages">

                        <div
                            id="pdfLoading"
                            class="pdf-loading">

                            <div class="pdf-loading-spinner"></div>

                            <div>جاري تحميل الكتاب...</div>

                        </div>

                    </div>

                </div>

            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>
                © 2026 مكتبة ثانوية مصاص رابح الإلكترونية
            </p>
        </div>
    </footer>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        const SUPABASE_URL = "https://xdkluojrvdhdtihblpwy.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_znxrXQ3DJxs8D5O--_TCcQ_6tXDfpFK";

        const API_URL = "/api/books";

        let currentUser = null;
        let currentProfile = null;
        let currentBook = null;
        let pdfDocument = null;
        let renderedPages = 0;

        const bookTitle = document.getElementById("bookTitle");
        const bookAuthor = document.getElementById("bookAuthor");
        const bookDescription = document.getElementById("bookDescription");
        const bookCategory = document.getElementById("bookCategory");
        const bookCover = document.getElementById("bookCover");
        const bookMeta = document.getElementById("bookMeta");

        const readButton = document.getElementById("readButton");
        const downloadButton = document.getElementById("downloadButton");
        const backButton = document.getElementById("backButton");

        const loginRequired = document.getElementById("loginRequired");
        const loginRequiredButton =
            document.getElementById("loginRequiredButton");

        const loginButton = document.getElementById("loginButton");
        const dashboardBack = document.getElementById("dashboardBack");

        const pdfSection = document.getElementById("pdfSection");
        const pdfReaderContainer =
            document.getElementById("pdfReaderContainer");
        const pdfPages = document.getElementById("pdfPages");
        const pdfLoading = document.getElementById("pdfLoading");

        const pdfProgressBar =
            document.getElementById("pdfProgressBar");

        const pdfProgressText =
            document.getElementById("pdfProgressText");

        const pdfPageInfo =
            document.getElementById("pdfPageInfo");

        const closePdfButton =
            document.getElementById("closePdfButton");

        const fullscreenButton =
            document.getElementById("fullscreenButton");

        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getBookId() {
            const params = new URLSearchParams(window.location.search);
            return params.get("id");
        }

        async function supabaseRequest(path, options = {}) {
            const response = await fetch(
                SUPABASE_URL + path,
                {
                    ...options,
                    headers: {
                        apikey: SUPABASE_ANON_KEY,
                        Authorization:
                            "Bearer " + SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        ...(options.headers || {})
                    }
                }
            );

            const text = await response.text();

            let data = null;

            try {
                data = text ? JSON.parse(text) : null;
            } catch {
                data = text;
            }

            if (!response.ok) {
                throw new Error(
                    data?.message ||
                    data?.error_description ||
                    data?.error ||
                    "حدث خطأ أثناء الاتصال بالخادم."
                );
            }

            return data;
        }

        async function setupUser() {
            try {
                const response = await fetch(
                    SUPABASE_URL + "/auth/v1/user",
                    {
                        headers: {
                            apikey: SUPABASE_ANON_KEY,
                            Authorization:
                                "Bearer " +
                                localStorage.getItem("sb-access-token")
                        }
                    }
                );

                if (!response.ok) {
                    currentUser = null;
                    currentProfile = null;
                    return false;
                }

                currentUser = await response.json();

                if (!currentUser?.id) {
                    currentUser = null;
                    currentProfile = null;
                    return false;
                }

                try {
                    const profiles = await supabaseRequest(
                        "/rest/v1/profiles?id=eq." +
                        encodeURIComponent(currentUser.id) +
                        "&select=id,full_name,role"
                    );

                    currentProfile =
                        Array.isArray(profiles)
                            ? profiles[0] || null
                            : null;

                } catch (profileError) {
                    console.error(
                        "Profile error:",
                        profileError
                    );
                }

                return true;

            } catch (error) {
                console.error(
                    "Authentication error:",
                    error
                );

                currentUser = null;
                currentProfile = null;

                return false;
            }
        }

        function getRoleDashboard(role) {
            switch (String(role || "").toLowerCase()) {
                case "programmer":
                case "مبرمج":
                    return "programmer.html";

                case "admin":
                case "administrator":
                case "مدير":
                    return "admin.html";

                case "teacher":
                case "teacher":
                case "استاذ":
                case "أستاذ":
                    return "teacher.html";

                case "student":
                case "طالب":
                    return "student.html";

                default:
                    return null;
            }
        }

        function updateAccountUI() {
            if (currentUser) {

                loginButton.textContent =
                    currentProfile?.full_name
                        ? currentProfile.full_name
                        : "حسابي";

                const dashboard =
                    getRoleDashboard(
                        currentProfile?.role
                    );

                if (dashboard) {
                    dashboardBack.style.display = "inline-flex";

                    dashboardBack.onclick = () => {
                        window.location.href = dashboard;
                    };
                }

            } else {

                loginButton.textContent =
                    "تسجيل الدخول";

                dashboardBack.style.display =
                    "none";

            }
        }

        async function loadBook() {

            const bookId = getBookId();

            if (!bookId) {
                showBookError(
                    "لم يتم تحديد الكتاب."
                );
                return;
            }

            try {

                const response = await fetch(
                    API_URL +
                    "?id=" +
                    encodeURIComponent(bookId)
                );

                if (!response.ok) {
                    throw new Error(
                        "تعذر تحميل بيانات الكتاب."
                    );
                }

                const data = await response.json();

                let book = data;

                if (Array.isArray(data)) {
                    book = data[0];
                }

                if (data?.book) {
                    book = data.book;
                }

                if (!book) {
                    throw new Error(
                        "الكتاب غير موجود."
                    );
                }

                currentBook = book;

                displayBook(book);

                const isLoggedIn =
                    await setupUser();

                updateAccountUI();

                if (isLoggedIn) {
                    readButton.style.display =
                        "inline-flex";

                    downloadButton.style.display =
                        "inline-flex";

                    loginRequired.style.display =
                        "none";

                } else {

                    readButton.style.display =
                        "none";

                    downloadButton.style.display =
                        "none";

                    loginRequired.style.display =
                        "block";
                }

            } catch (error) {

                console.error(
                    "Book loading error:",
                    error
                );

                showBookError(
                    error.message ||
                    "حدث خطأ أثناء تحميل الكتاب."
                );
            }
        }

        function displayBook(book) {

            bookTitle.textContent =
                book.title ||
                book.name ||
                "بدون عنوان";

            bookAuthor.textContent =
                book.author
                    ? "✍️ المؤلف: " +
                      book.author
                    : "";

            bookCategory.textContent =
                book.category ||
                "غير مصنف";

            bookDescription.textContent =
                book.description ||
                "لا يوجد وصف متاح لهذا الكتاب.";

            if (book.cover_url) {

                bookCover.src =
                    book.cover_url;

                bookCover.onerror = () => {
                    bookCover.src =
                        "../favicone.png";
                };

            } else {

                bookCover.src =
                    "../favicone.png";
            }

            const meta = [];

            if (book.subject) {
                meta.push({
                    label: "المادة",
                    value: book.subject
                });
            }

            if (book.level) {
                meta.push({
                    label: "المستوى",
                    value: book.level
                });
            }

            if (book.year) {
                meta.push({
                    label: "السنة",
                    value: book.year
                });
            }

            if (book.language) {
                meta.push({
                    label: "اللغة",
                    value: book.language
                });
            }

            if (book.file_size) {
                meta.push({
                    label: "حجم الملف",
                    value: book.file_size
                });
            }

            bookMeta.innerHTML =
                meta.map(item => `
                    <div class="meta-item">
                        <span class="meta-label">
                            ${escapeHtml(item.label)}
                        </span>
                        <span class="meta-value">
                            ${escapeHtml(item.value)}
                        </span>
                    </div>
                `).join("");
        }

        function showBookError(message) {

            const card =
                document.getElementById(
                    "bookDetailsCard"
                );

            card.innerHTML = `
                <div style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:50px 20px;
                ">
                    <h2 style="margin-bottom:15px;">
                        ⚠️ تعذر تحميل الكتاب
                    </h2>

                    <p style="
                        color:#666;
                        margin-bottom:25px;
                    ">
                        ${escapeHtml(message)}
                    </p>

                    <button
                        id="errorBackButton"
                        class="book-action-btn back-btn"
                        type="button">
                        ← العودة إلى الكتب
                    </button>
                </div>
            `;

            document
                .getElementById(
                    "errorBackButton"
                )
                .addEventListener(
                    "click",
                    () => {
                        window.location.href =
                            "books.html";
                    }
                );
        }

        async function getPdfUrl() {

            if (!currentBook) {
                throw new Error(
                    "بيانات الكتاب غير متوفرة."
                );
            }

            if (currentBook.pdf_url) {
                return currentBook.pdf_url;
            }

            if (currentBook.pdfUrl) {
                return currentBook.pdfUrl;
            }

            const bookId =
                currentBook.id ||
                getBookId();

            if (!bookId) {
                throw new Error(
                    "معرف الكتاب غير موجود."
                );
            }

            const response = await fetch(
                API_URL +
                "/" +
                encodeURIComponent(bookId) +
                "/pdf"
            );

            if (!response.ok) {
                throw new Error(
                    "تعذر الحصول على رابط الكتاب."
                );
            }

            const data =
                await response.json();

            return (
                data?.url ||
                data?.pdf_url ||
                data?.pdfUrl ||
                data
            );
        }

        function showPdfSection() {
            pdfSection.style.display =
                "block";

            pdfSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

        function hidePdfSection() {
            pdfSection.style.display =
                "none";

            pdfPages.innerHTML = `
                <div id="pdfLoading" class="pdf-loading">
                    <div class="pdf-loading-spinner"></div>
                    <div>جاري تحميل الكتاب...</div>
                </div>
            `;

            pdfDocument = null;
            renderedPages = 0;

            pdfProgressBar.style.width =
                "0%";

            pdfProgressText.textContent =
                "جاري التحميل...";

            pdfPageInfo.textContent =
                "الصفحة 0 / 0";
        }

        function updatePdfProgress(
            current,
            total
        ) {
            const percentage =
                total > 0
                    ? Math.round(
                        (current / total) * 100
                    )
                    : 0;

            pdfProgressBar.style.width =
                percentage + "%";

            pdfProgressText.textContent =
                `تم تحميل ${current} من ${total} صفحة (${percentage}%)`;

            pdfPageInfo.textContent =
                `الصفحة ${current} / ${total}`;
        }

        async function renderPdfPage(
            pdf,
            pageNumber
        ) {

            const page =
                await pdf.getPage(
                    pageNumber
                );

            const baseViewport =
                page.getViewport({
                    scale: 1
                });

            const containerWidth =
                pdfPages.clientWidth -
                30;

            let scale =
                Math.min(
                    1.7,
                    containerWidth /
                    baseViewport.width
                );

            if (!isFinite(scale) ||
                scale <= 0) {
                scale = 1.2;
            }

            const viewport =
                page.getViewport({
                    scale
                });

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.className =
                "pdf-page";

            canvas.dataset.page =
                pageNumber;

            canvas.width =
                Math.floor(
                    viewport.width
                );

            canvas.height =
                Math.floor(
                    viewport.height
                );

            pdfPages.appendChild(
                canvas
            );

            const context =
                canvas.getContext("2d");

            await page.render({
                canvasContext: context,
                viewport
            }).promise;

            renderedPages =
                Math.max(
                    renderedPages,
                    pageNumber
                );

            updatePdfProgress(
                renderedPages,
                pdf.numPages
            );
        }

        async function loadProgressivePdf(
            url
        ) {

            pdfPages.innerHTML = `
                <div class="pdf-loading" id="pdfLoading">
                    <div class="pdf-loading-spinner"></div>
                    <div id="pdfLoadingMessage">
                        جاري الاتصال بالملف...
                    </div>
                </div>
            `;

            pdfProgressBar.style.width =
                "0%";

            pdfProgressText.textContent =
                "جاري الاتصال بالملف...";

            try {

                const loadingTask =
                    pdfjsLib.getDocument({
                        url: url,
                        rangeChunkSize: 1024 * 1024,
                        disableAutoFetch: false,
                        disableStream: false
                    });

                loadingTask.onProgress =
                    progressData => {

                        if (
                            progressData.total
                        ) {

                            const percentage =
                                Math.round(
                                    (
                                        progressData.loaded /
                                        progressData.total
                                    ) * 100
                                );

                            pdfProgressBar.style.width =
                                percentage + "%";

                            pdfProgressText.textContent =
                                `جاري تحميل الملف ${percentage}%`;
                        }
                    };

                pdfDocument =
                    await loadingTask.promise;

                pdfPages.innerHTML = "";

                pdfPageInfo.textContent =
                    `الصفحة 0 / ${pdfDocument.numPages}`;

                renderedPages = 0;

                for (
                    let pageNumber = 1;
                    pageNumber <=
                    pdfDocument.numPages;
                    pageNumber++
                ) {

                    await renderPdfPage(
                        pdfDocument,
                        pageNumber
                    );
                }

                pdfProgressBar.style.width =
                    "100%";

                pdfProgressText.textContent =
                    `اكتمل تحميل الكتاب — ${pdfDocument.numPages} صفحة`;

            } catch (error) {

                console.error(
                    "PDF loading error:",
                    error
                );

                pdfPages.innerHTML = "";

                const errorBox =
                    document.createElement(
                        "div"
                    );

                errorBox.className =
                    "pdf-error";

                errorBox.innerHTML = `
                    <h3>
                        ⚠️ تعذر فتح الكتاب
                    </h3>
                    <p>
                        تحقق من اتصال الإنترنت أو حاول مرة أخرى.
                    </p>
                `;

                pdfPages.appendChild(
                    errorBox
                );

                pdfProgressText.textContent =
                    "فشل تحميل الكتاب.";
            }
        }

        async function openPdf() {

            if (!currentUser) {

                loginRequired.style.display =
                    "block";

                return;
            }

            if (!currentBook) {
                return;
            }

            try {

                showPdfSection();

                const pdfUrl =
                    await getPdfUrl();

                if (!pdfUrl) {
                    throw new Error(
                        "لم يتم العثور على رابط PDF."
                    );
                }

                await loadProgressivePdf(
                    pdfUrl
                );

            } catch (error) {

                console.error(
                    "Open PDF error:",
                    error
                );

                pdfPages.innerHTML = `
                    <div class="pdf-error">
                        <h3>
                            ⚠️ تعذر فتح الكتاب
                        </h3>
                        <p>
                            ${escapeHtml(
                                error.message ||
                                "حدث خطأ غير معروف."
                            )}
                        </p>
                    </div>
                `;
            }
        }

        async function downloadPdf() {

            if (!currentUser) {
                loginRequired.style.display =
                    "block";
                return;
            }

            if (!currentBook) {
                return;
            }

            try {

                downloadButton.disabled =
                    true;

                downloadButton.textContent =
                    "⏳ جاري التحضير...";

                const pdfUrl =
                    await getPdfUrl();

                if (!pdfUrl) {
                    throw new Error(
                        "لم يتم العثور على ملف PDF."
                    );
                }

                const response =
                    await fetch(pdfUrl);

                if (!response.ok) {
                    throw new Error(
                        "تعذر تحميل ملف PDF."
                    );
                }

                const blob =
                    await response.blob();

                const blobUrl =
                    URL.createObjectURL(
                        blob
                    );

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    blobUrl;

                const safeTitle =
                    String(
                        currentBook.title ||
                        "book"
                    )
                        .replace(
                            /[\\/:*?"<>|]/g,
                            ""
                        )
                        .trim() ||
                    "book";

                link.download =
                    safeTitle + ".pdf";

                document.body.appendChild(
                    link
                );

                link.click();

                link.remove();

                URL.revokeObjectURL(
                    blobUrl
                );

            } catch (error) {

                console.error(
                    "Download error:",
                    error
                );

                alert(
                    error.message ||
                    "تعذر تحميل الكتاب."
                );

            } finally {

                downloadButton.disabled =
                    false;

                downloadButton.textContent =
                    "⬇️ تحميل الكتاب";
            }
        }

        loginButton.addEventListener(
            "click",
            () => {
                window.location.href =
                    "login.html";
            }
        );

        loginRequiredButton.addEventListener(
            "click",
            () => {
                window.location.href =
                    "login.html";
            }
        );

        readButton.addEventListener(
            "click",
            openPdf
        );

        downloadButton.addEventListener(
            "click",
            downloadPdf
        );

        backButton.addEventListener(
            "click",
            () => {
                window.location.href =
                    "books.html";
            }
        );

        closePdfButton.addEventListener(
            "click",
            hidePdfSection
        );

        fullscreenButton.addEventListener(
            "click",
            async () => {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await pdfReaderContainer
                            .requestFullscreen();

                    } else {

                        await document
                            .exitFullscreen();
                    }

                } catch (error) {

                    console.error(
                        "Fullscreen error:",
                        error
                    );
                }
            }
        );

        document.addEventListener(
            "fullscreenchange",
            () => {

                if (
                    document.fullscreenElement
                ) {

                    fullscreenButton.textContent =
                        "⛶ إغلاق ملء الشاشة";

                } else {

                    fullscreenButton.textContent =
                        "⛶ ملء الشاشة";
                }
            }
        );

        window.addEventListener(
            "load",
            loadBook
        );
    </script>

</body>
