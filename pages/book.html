<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تفاصيل الكتاب | مكتبة الثانوية</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>


<!-- شريط التنقل -->

<header class="navbar">

    <div class="logo">

        <div class="logo-icon">📚</div>

        <div>

            <div class="logo-title">
                مكتبة الثانوية
            </div>

            <div class="logo-subtitle">
                المكتبة الإلكترونية
            </div>

        </div>

    </div>


    <nav>

        <a href="../index.html">
            الرئيسية
        </a>

        <a href="books.html" class="active">
            الكتب
        </a>

        <a href="categories.html">
            التصنيفات
        </a>

        <a href="#">
            عن المكتبة
        </a>

    </nav>


    <button class="login-btn">
        تسجيل الدخول
    </button>

</header>



<!-- محتوى الكتاب -->

<main>

    <section class="section">

        <div class="book-details">


            <!-- غلاف الكتاب -->

            <div class="book-details-cover">

                <img
                    id="bookCover"
                    src=""
                    alt="غلاف الكتاب">

            </div>



            <!-- معلومات الكتاب -->

            <div class="book-details-info">


                <span
                    class="book-category"
                    id="bookCategory">
                </span>


                <h1 id="bookTitle">
                    اسم الكتاب
                </h1>


                <p class="book-author">

                    ✍️ المؤلف:
                    <strong id="bookAuthor">
                    </strong>

                </p>


                <p
                    id="bookDescription"
                    class="book-description">
                </p>



                <!-- معلومات إضافية -->

                <div class="book-meta">

                    <div>

                        <span>
                            المادة
                        </span>

                        <strong id="metaCategory">
                        </strong>

                    </div>

                    <div>

                        <span>
                            نوع الملف
                        </span>

                        <strong>
                            PDF
                        </strong>

                    </div>

                </div>



                <!-- الأزرار -->

                <div class="book-actions">

                    <a
                        id="readButton"
                        href="#pdfReader"
                        class="read-button">

                        📖 قراءة الكتاب

                    </a>


                    <a
                        id="downloadButton"
                        href=""
                        class="download-button"
                        download>

                        ⬇️ تحميل الكتاب

                    </a>


                    <a
                        href="books.html"
                        class="back-button">

                        ← العودة إلى الكتب

                    </a>

                </div>

            </div>

        </div>



        <!-- قارئ PDF -->

        <div
            id="pdfSection"
            class="pdf-section">

            <h2>
                📖 قراءة الكتاب
            </h2>


            <iframe
                id="pdfReader"
                src=""
                width="100%"
                height="800"
                style="
                    border: none;
                    border-radius: 12px;
                ">
            </iframe>

        </div>

    </section>

</main>



<!-- الفوتر -->

<footer>

    <div class="copyright">

        © 2026 مكتبة الثانوية — جميع الحقوق محفوظة

    </div>

</footer>



<!-- بيانات الكتب -->

<script src="../books-data.js"></script>



<script>

    /*
       قراءة رقم الكتاب من الرابط
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const bookIndex =
        parseInt(
            params.get("book")
        );



    /*
       الحصول على بيانات الكتاب
    */

    const book =
        booksData[bookIndex];



    /*
       التأكد من وجود الكتاب
    */

    if (
        !book ||
        isNaN(bookIndex)
    ) {

        document.querySelector("main").innerHTML = `

            <section class="section">

                <div style="
                    text-align: center;
                    padding: 80px 20px;
                ">

                    <h2>
                        📚 الكتاب غير موجود
                    </h2>

                    <p>
                        عذرًا، لم نتمكن من العثور على هذا الكتاب.
                    </p>

                    <br>

                    <a
                        href="books.html"
                        class="read-button">

                        ← العودة إلى الكتب

                    </a>

                </div>

            </section>

        `;

    }

    else {


        /*
           معلومات الكتاب
        */

        document.title =
            book.title +
            " | مكتبة الثانوية";


        document.getElementById(
            "bookTitle"
        ).textContent =
            book.title;


        document.getElementById(
            "bookAuthor"
        ).textContent =
            book.author;


        document.getElementById(
            "bookCategory"
        ).textContent =
            book.category;


        document.getElementById(
            "metaCategory"
        ).textContent =
            book.category;


        document.getElementById(
            "bookDescription"
        ).textContent =
            book.description;



        /*
           الغلاف
        */

        const cover =
            document.getElementById(
                "bookCover"
            );


        if (book.cover) {

            cover.src =
                "../covers/" +
                book.cover;

            cover.alt =
                "غلاف " +
                book.title;

        }

        else {

            cover.src =
                "../covers/DD.png";

            cover.alt =
                "غلاف الكتاب";

        }



        /*
           ملف PDF
        */

        const pdfSection =
            document.getElementById(
                "pdfSection"
            );


        const pdfReader =
            document.getElementById(
                "pdfReader"
            );


        const downloadButton =
            document.getElementById(
                "downloadButton"
            );


        const readButton =
            document.getElementById(
                "readButton"
            );



        if (book.pdf) {

            const pdfPath =
                "../books/" +
                book.pdf;


            pdfReader.src =
                pdfPath;


            downloadButton.href =
                pdfPath;


            downloadButton.download =
                book.pdf;


            readButton.href =
                "#pdfSection";

        }

        else {

            pdfSection.style.display =
                "none";


            downloadButton.style.display =
                "none";


            readButton.style.display =
                "none";

        }

    }

</script>


</body>

</html>
