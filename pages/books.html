<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    /* ==========================================
       إعداد Supabase
    ========================================== */


    const SUPABASE_URL =
        "https://xdkluojrvdhdtihblpwy.supabase.co";


    /*
       مهم جدًا:

       ضع هنا نفس مفتاح Supabase الحالي
       الموجود عندك في ملف books.html.

       لا تستخدم النص الموجود كمفتاح حقيقي.
    */


    const SUPABASE_ANON_KEY =
        "sb_publishable_znxrXQ3DJxs8D5O--_TCcQ_6tXDfpFK";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* ==========================================
       المستخدم الحالي والصلاحية
    ========================================== */


    let currentUser = null;

    let currentProfile = null;


    /* ==========================================
       زر العودة للوحة
    ========================================== */


    async function setupDashboardButton() {


        const backButton =
            document.getElementById(
                "dashboardBackBtn"
            );


        const loginButton =
            document.getElementById(
                "loginBtn"
            );


        try {


            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth.getUser();


            currentUser =
                user || null;


            if (!user) {


                currentProfile =
                    null;


                backButton.style.display =
                    "none";


                loginButton.style.display =
                    "block";


                return;

            }


            const {
                data: profile,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "full_name, role"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .single();


            if (
                error ||
                !profile
            ) {


                currentProfile =
                    null;


                backButton.style.display =
                    "none";


                loginButton.style.display =
                    "block";


                return;

            }


            currentProfile =
                profile;


            /* --------------------------------------
               المبرمج
            -------------------------------------- */


            if (
                profile.role ===
                "programmer"
            ) {


                backButton.href =
                    "programmer.html";


                backButton.textContent =
                    "⬅️ لوحة المبرمج";


                backButton.style.display =
                    "inline-block";


                loginButton.style.display =
                    "none";


            }


            /* --------------------------------------
               المدير
            -------------------------------------- */


            else if (
                profile.role ===
                "admin"
            ) {


                backButton.href =
                    "admin.html";


                backButton.textContent =
                    "⬅️ لوحة المدير";


                backButton.style.display =
                    "inline-block";


                loginButton.style.display =
                    "none";


            }


            /* --------------------------------------
               الأستاذ
            -------------------------------------- */


            else if (
                profile.role ===
                "teacher"
            ) {


                backButton.href =
                    "teacher.html";


                backButton.textContent =
                    "⬅️ لوحة الأستاذ";


                backButton.style.display =
                    "inline-block";


                loginButton.style.display =
                    "none";


            }


            /* --------------------------------------
               الطالب
            -------------------------------------- */


            else {


                backButton.style.display =
                    "none";


                loginButton.style.display =
                    "block";

            }


        }


        catch (error) {


            console.error(
                "Dashboard button error:",
                error
            );


            currentUser =
                null;


            currentProfile =
                null;


            backButton.style.display =
                "none";


            loginButton.style.display =
                "block";

        }

    }


    /* ==========================================
       عناصر الصفحة
    ========================================== */


    const booksContainer =
        document.getElementById(
            "booksContainer"
        );


    const searchInput =
        document.getElementById(
            "bookSearch"
        );


    const pageTitle =
        document.getElementById(
            "pageTitle"
        );


    const resultsCount =
        document.getElementById(
            "resultsCount"
        );


    let booksData = [];


    /* ==========================================
       حماية النصوص
    ========================================== */


    function escapeHTML(value) {


        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value == null
                ? ""
                : String(value);


        return div.innerHTML;

    }


    /* ==========================================
       توحيد أسماء التصنيفات
    ========================================== */


    function normalizeCategory(category) {


        if (!category) {

            return "";

        }


        const value =
            String(category)
                .trim()
                .replace(
                    /\s+/g,
                    " "
                );


        /* الرياضيات */


        if (
            value === "رياضيات" ||
            value === "الرياضيات"
        ) {

            return "الرياضيات";

        }


        /* العلوم الطبيعية */


        if (
            value === "علوم" ||
            value === "العلوم" ||
            value === "علم الطبيعة" ||
            value === "العلوم الطبيعية"
        ) {

            return "العلوم الطبيعية";

        }


        /* العلوم الفيزيائية */


        if (
            value === "فيزياء" ||
            value === "الفيزياء" ||
            value === "كيمياء" ||
            value === "الكيمياء" ||
            value === "العلوم الفيزيائية"
        ) {

            return "العلوم الفيزيائية";

        }


        /* التاريخ والجغرافيا */


        if (
            value === "تاريخ" ||
            value === "التاريخ" ||
            value === "جغرافيا" ||
            value === "الجغرافيا" ||
            value === "التاريخ والجغرافيا"
        ) {

            return "التاريخ والجغرافيا";

        }


        /* الفلسفة */


        if (
            value === "فلسفة" ||
            value === "الفلسفة"
        ) {

            return "الفلسفة";

        }


        /* العلوم الإسلامية */


        if (
            value === "إسلاميات" ||
            value === "الإسلاميات" ||
            value === "العلوم الإسلامية"
        ) {

            return "العلوم الإسلامية";

        }


        /* اللغات */


        if (
            value === "لغة" ||
            value === "لغات" ||
            value === "اللغات"
        ) {

            return "اللغات";

        }


        /* الإعلام الآلي */


        if (
            value === "إعلام آلي" ||
            value === "الإعلام الآلي" ||
            value === "معلوماتية" ||
            value === "المعلوماتية"
        ) {

            return "الإعلام الآلي";

        }


        /* الاقتصاد والمحاسبة */


        if (
            value === "اقتصاد" ||
            value === "الاقتصاد" ||
            value === "محاسبة" ||
            value === "المحاسبة" ||
            value === "الاقتصاد والمحاسبة"
        ) {

            return "الاقتصاد والمحاسبة";

        }


        return value;

    }


    /* ==========================================
       هل يستطيع المستخدم حذف الكتاب؟
    ========================================== */


    function canDeleteBook(book) {


        if (
            !currentUser ||
            !currentProfile
        ) {

            return false;

        }


        const role =
            currentProfile.role;


        /* المبرمج يستطيع حذف أي كتاب */


        if (
            role === "programmer"
        ) {

            return true;

        }


        /* المدير يستطيع حذف أي كتاب */


        if (
            role === "admin"
        ) {

            return true;

        }


        /* الأستاذ يستطيع حذف كتبه فقط */


        if (
            role === "teacher"
        ) {

            return (
                book.uploaded_by ===
                currentUser.id
            );

        }


        /* الطالب والزائر ممنوعان */


        return false;

    }


    /* ==========================================
       حذف الكتاب
    ========================================== */


    async function deleteBook(book) {


        if (
            !book ||
            !book.id
        ) {

            return;

        }


        const confirmed =
            window.confirm(

                "⚠️ هل أنت متأكد من حذف الكتاب؟\n\n" +

                "العنوان: " +
                (book.title || "بدون عنوان") +

                "\n\n" +

                "سيتم حذف الكتاب وملف PDF من التخزين السحابي نهائيًا."

            );


        if (!confirmed) {

            return;

        }


        try {


            /* --------------------------------------
               التأكد من الجلسة
            -------------------------------------- */


            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth.getSession();


            if (
                !session
            ) {

                alert(
                    "يجب تسجيل الدخول أولًا."
                );

                return;

            }


            /* --------------------------------------
               التحقق من الصلاحية محليًا
            -------------------------------------- */


            if (
                !canDeleteBook(book)
            ) {

                alert(
                    "ليس لديك صلاحية حذف هذا الكتاب."
                );

                return;

            }


            /* --------------------------------------
               العثور على الزر
            -------------------------------------- */


            const buttons =
                document.querySelectorAll(
                    ".delete-button"
                );


            let clickedButton =
                null;


            buttons.forEach(
                function(button) {


                    if (
                        button.dataset.bookId ===
                        String(book.id)
                    ) {

                        clickedButton =
                            button;

                    }

                }
            );


            if (clickedButton) {

                clickedButton.disabled =
                    true;

                clickedButton.textContent =
                    "⏳ جارٍ الحذف...";

            }


            /* --------------------------------------
               إرسال طلب الحذف للخادم
            -------------------------------------- */


            const response =
                await fetch(

                    "/api/books/" +
                    encodeURIComponent(
                        book.id
                    ),

                    {

                        method:
                            "DELETE",

                        headers: {

                            Authorization:
                                "Bearer " +
                                session.access_token

                        }

                    }

                );


            let result;


            try {

                result =
                    await response.json();

            }

            catch (jsonError) {

                result = {

                    success:
                        false,

                    message:
                        "استجاب الخادم برد غير صالح."

                };

            }


            /* --------------------------------------
               فشل الحذف
            -------------------------------------- */


            if (
                !response.ok ||
                !result.success
            ) {


                throw new Error(

                    result.message ||
                    "تعذر حذف الكتاب."

                );

            }


            /* --------------------------------------
               إزالة الكتاب من القائمة
            -------------------------------------- */


            booksData =
                booksData.filter(
                    function(item) {

                        return (
                            String(item.id) !==
                            String(book.id)
                        );

                    }
                );


            /* إعادة عرض الكتب */


            filterBooks();


            alert(
                "✅ تم حذف الكتاب بنجاح."
            );


        }


        catch (error) {


            console.error(
                "Delete book error:",
                error
            );


            alert(

                "❌ تعذر حذف الكتاب.\n\n" +
                (
                    error.message ||
                    "حدث خطأ غير معروف."
                )

            );


            /* إعادة الزر إلى حالته الطبيعية */


            const buttons =
                document.querySelectorAll(
                    ".delete-button"
                );


            buttons.forEach(
                function(button) {


                    if (
                        button.dataset.bookId ===
                        String(book.id)
                    ) {

                        button.disabled =
                            false;

                        button.textContent =
                            "🗑️ حذف الكتاب";

                    }

                }
            );

        }

    }


    /* ==========================================
       إنشاء بطاقة الكتاب
    ========================================== */


    function createBookCard(book) {


        const article =
            document.createElement(
                "article"
            );


        article.className =
            "book-card";


        let coverHTML = `

            <div class="book-placeholder">
                📚
            </div>

        `;


        if (
            book.cover_url
        ) {


            coverHTML = `

                <img
                    src="${escapeHTML(
                        book.cover_url
                    )}"
                    alt="غلاف ${escapeHTML(
                        book.title
                    )}">

            `;

        }


        /* --------------------------------------
           زر القراءة
        -------------------------------------- */


        const readButton = `

            <a
                href="book.html?id=${encodeURIComponent(
                    book.id
                )}"
                class="read-button">

                📖 قراءة الكتاب

            </a>

        `;


        /* --------------------------------------
           زر الحذف
        -------------------------------------- */


        let deleteButton =
            "";


        if (
            canDeleteBook(book)
        ) {


            deleteButton = `

                <button
                    type="button"
                    class="delete-button"
                    data-book-id="${escapeHTML(
                        book.id
                    )}">

                    🗑️ حذف الكتاب

                </button>

            `;

        }


        /* --------------------------------------
           بناء البطاقة
        -------------------------------------- */


        article.innerHTML = `

            <div class="book-cover">

                ${coverHTML}

            </div>


            <div class="book-info">


                <span class="book-category">

                    ${escapeHTML(
                        normalizeCategory(
                            book.category ||
                            "عام"
                        )
                    )}

                </span>


                <h3>

                    ${escapeHTML(
                        book.title ||
                        "بدون عنوان"
                    )}

                </h3>


                <p>

                    ${escapeHTML(
                        book.description ||
                        "لا يوجد وصف لهذا الكتاب."
                    )}

                </p>


                <p style="
                    color: #64748b;
                    font-size: 14px;
                    margin-top: 8px;
                ">

                    ✍️ ${escapeHTML(
                        book.author ||
                        "مؤلف غير محدد"
                    )}

                </p>


                <div class="book-actions">

                    ${readButton}

                    ${deleteButton}

                </div>


            </div>

        `;


        /* --------------------------------------
           ربط زر الحذف بالوظيفة
        -------------------------------------- */


        const deleteButtonElement =
            article.querySelector(
                ".delete-button"
            );


        if (
            deleteButtonElement
        ) {


            deleteButtonElement.addEventListener(
                "click",
                function() {

                    deleteBook(book);

                }
            );

        }


        return article;

    }


    /* ==========================================
       عرض الكتب
    ========================================== */


    function displayBooks(list) {


        booksContainer.innerHTML =
            "";


        if (
            list.length === 0
        ) {


            resultsCount.textContent =
                "لم يتم العثور على أي كتاب.";


            booksContainer.innerHTML = `

                <div style="
                    grid-column: 1 / -1;
                    text-align: center;
                    padding: 60px 20px;
                    font-size: 20px;
                    color: #64748b;
                ">

                    📚 لا توجد كتب مطابقة للبحث

                </div>

            `;


            return;

        }


        if (
            list.length === 1
        ) {


            resultsCount.textContent =
                "تم العثور على كتاب واحد.";

        }


        else {


            resultsCount.textContent =
                "تم العثور على " +
                list.length +
                " كتب.";

        }


        list.forEach(
            function(book) {


                const card =
                    createBookCard(book);


                booksContainer.appendChild(
                    card
                );

            }
        );

    }


    /* ==========================================
       البحث والتصنيف
    ========================================== */


    function filterBooks() {


        const search =
            searchInput.value
                .toLowerCase()
                .trim();


        const params =
            new URLSearchParams(
                window.location.search
            );


        const category =
            params.get("category");


        const normalizedSelectedCategory =
            normalizeCategory(
                category
            );


        const filteredBooks =
            booksData.filter(
                function(book) {


                    const title =
                        (book.title || "")
                            .toLowerCase();


                    const author =
                        (book.author || "")
                            .toLowerCase();


                    const bookCategory =
                        (book.category || "")
                            .toLowerCase();


                    const normalizedBookCategory =
                        normalizeCategory(
                            book.category || ""
                        );


                    const description =
                        (book.description || "")
                            .toLowerCase();


                    const matchesSearch =

                        title.includes(
                            search
                        ) ||

                        author.includes(
                            search
                        ) ||

                        bookCategory.includes(
                            search
                        ) ||

                        normalizedBookCategory
                            .toLowerCase()
                            .includes(
                                search
                            ) ||

                        description.includes(
                            search
                        );


                    const matchesCategory =

                        !normalizedSelectedCategory ||

                        normalizedBookCategory ===
                        normalizedSelectedCategory;


                    return (
                        matchesSearch &&
                        matchesCategory
                    );

                }
            );


        displayBooks(
            filteredBooks
        );

    }


    /* ==========================================
       تحميل الكتب
    ========================================== */


    async function loadBooks() {


        try {


            resultsCount.textContent =
                "جاري تحميل الكتب...";


            const response =
                await fetch(
                    "/api/books"
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const result =
                await response.json();


            if (
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "تعذر تحميل الكتب."
                );

            }


            booksData =
                Array.isArray(
                    result.books
                )
                    ? result.books
                    : [];


            console.log(
                "تم تحميل الكتب:",
                booksData
            );


            console.log(
                "إجمالي الكتب:",
                booksData.length
            );


            filterBooks();


        }


        catch (error) {


            console.error(
                "Books loading error:",
                error
            );


            resultsCount.textContent =
                "";


            booksContainer.innerHTML = `

                <div style="
                    grid-column: 1 / -1;
                    text-align: center;
                    padding: 60px 20px;
                    font-size: 20px;
                    color: #b91c1c;
                ">

                    ❌ تعذر تحميل الكتب من الخادم.

                    <br><br>

                    <span style="
                        font-size: 15px;
                        color: #64748b;
                    ">

                        تأكد من أن الخادم يعمل.

                    </span>

                </div>

            `;

        }

    }


    /* ==========================================
       البحث أثناء الكتابة
    ========================================== */


    searchInput.addEventListener(
        "input",
        filterBooks
    );


    /* ==========================================
       معاملات الرابط
    ========================================== */


    const params =
        new URLSearchParams(
            window.location.search
        );


    /* البحث من الصفحة الرئيسية */


    const searchFromHome =
        params.get("search");


    if (
        searchFromHome
    ) {

        searchInput.value =
            searchFromHome;

    }


    /* ==========================================
       إظهار التصنيف
    ========================================== */


    const category =
        params.get("category");


    if (
        category
    ) {


        pageTitle.textContent =
            "كتب " +
            normalizeCategory(
                category
            );

    }


    /* ==========================================
       تشغيل الصفحة
    ========================================== */


    async function initializePage() {


        /*
           مهم:

           ننتظر أولًا معرفة المستخدم وصلاحيته،
           ثم نحمل الكتب.

           هذا يمنع ظهور البطاقات بدون
           زر الحذف بسبب تأخر تحميل الحساب.
        */


        await setupDashboardButton();


        await loadBooks();

    }


    initializePage();


</script>
