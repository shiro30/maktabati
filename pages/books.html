<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    الكتب | مكتبة ثانوية مصاص رابح
</title>

<link
    rel="icon"
    type="image/png"
    href="../favicon.png">

<link
    rel="stylesheet"
    href="../style.css">

<style>

    .dashboard-back-btn {
        display: none;
        text-decoration: none;
        background: #0b1f3a;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 700;
        margin-right: 15px;
        transition: 0.2s;
    }

    .dashboard-back-btn:hover {
        background: #16365f;
    }

    .navbar {
        gap: 15px;
    }

    .book-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
    }

    .book-actions .read-button {
        margin-top: 0;
    }

    .delete-button {
        border: none;
        cursor: pointer;
        background: #dc2626;
        color: white;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 14px;
        transition: 0.2s;
    }

    .delete-button:hover {
        background: #b91c1c;
        transform: translateY(-1px);
    }

    .delete-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .book-cover {
        min-height: 280px;
        background: #eef2f7;
        border-radius: 10px;
        overflow: hidden;
    }

    .book-cover img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 10px;
        display: block;
        background: #eef2f7;
    }

    .book-placeholder {
        width: 100%;
        height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef2f7;
        border-radius: 10px;
        font-size: 70px;
    }

    .loading-books {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        font-size: 20px;
        color: #64748b;
    }

    @media (max-width: 800px) {

        .dashboard-back-btn {
            padding: 8px 12px;
            font-size: 13px;
            margin-right: 5px;
        }

        .navbar nav {
            display: none;
        }

        .book-actions {
            flex-direction: column;
        }

        .book-actions .read-button,
        .book-actions .delete-button {
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .book-cover {
            min-height: 240px;
        }

        .book-cover img,
        .book-placeholder {
            height: 240px;
        }

    }

</style>

</head>

<body>

<header class="navbar">

<div class="logo">

    <div class="logo-icon">
        📚
    </div>

    <div>

        <div class="logo-title">
            مكتبة ثانوية مصاص رابح
        </div>

        <div class="logo-subtitle">
            المكتبة الرقمية للمؤسسة
        </div>

    </div>

</div>

<nav>

    <a href="../index.html">
        الرئيسية
    </a>

    <a
        href="books.html"
        class="active">
        الكتب
    </a>

    <a href="categories.html">
        التصنيفات
    </a>

    <a href="about.html">
        عن المكتبة
    </a>

</nav>

<a
    href="#"
    id="dashboardBackBtn"
    class="dashboard-back-btn">
</a>

<button
    class="login-btn"
    id="loginBtn"
    onclick="window.location.href='login.html'">

    تسجيل الدخول

</button>

</header>

<main>

<section class="section">

<div class="section-heading">

    <div>

        <span>
            مكتبة الثانوية
        </span>

        <h2 id="pageTitle">
            جميع الكتب
        </h2>

        <div class="search-box">

            <input
                type="text"
                id="bookSearch"
                placeholder="ابحث عن كتاب أو مؤلف أو مادة...">

            <span>
                🔎
            </span>

        </div>

        <p
            id="resultsCount"
            style="
                margin-top: 15px;
                color: #64748b;
                font-size: 15px;
            ">
        </p>

    </div>

</div>

<div
    class="books-container"
    id="booksContainer">

    <div class="loading-books">
        ⏳ جاري تحميل الكتب...
    </div>

</div>

</section>

</main>

<footer>

<div class="copyright">

    <strong>
        🏫 ثانوية مصاص رابح
    </strong>

    <br>

    مكتبة الثانوية الرقمية

    <br>

    <span style="font-size:13px;">

        مهندس النظام:
        شراف الدين بوردوسن —
        أستاذ مادة الرياضيات

    </span>

    <br>
    <br>

    © 2026 — جميع الحقوق محفوظة

</div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://xdkluojrvdhdtihblpwy.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_znxrXQ3DJxs8D5O--_TCcQ_6tXDfpFK";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    let currentUser = null;
    let currentProfile = null;

    const booksContainer =
        document.getElementById(
            "booksContainer"
        );

    const searchInput =
        document.getElementById(
            "bookSearch"
        );

    const pageTitle =
        document.getElementById(
            "pageTitle"
        );

    const resultsCount =
        document.getElementById(
            "resultsCount"
        );

    let booksData = [];


    function escapeHTML(value) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            value == null
                ? ""
                : String(value);

        return div.innerHTML;

    }


    function normalizeCategory(category) {

        if (!category) {
            return "";
        }

        const value =
            String(category)
                .trim()
                .replace(
                    /\s+/g,
                    " "
                );

        if (
            value === "رياضيات" ||
            value === "الرياضيات"
        ) {
            return "الرياضيات";
        }

        if (
            value === "علوم" ||
            value === "العلوم" ||
            value === "علم الطبيعة" ||
            value === "العلوم الطبيعية"
        ) {
            return "العلوم الطبيعية";
        }

        if (
            value === "فيزياء" ||
            value === "الفيزياء" ||
            value === "كيمياء" ||
            value === "الكيمياء" ||
            value === "العلوم الفيزيائية"
        ) {
            return "العلوم الفيزيائية";
        }

        if (
            value === "تاريخ" ||
            value === "التاريخ" ||
            value === "جغرافيا" ||
            value === "الجغرافيا" ||
            value === "التاريخ والجغرافيا"
        ) {
            return "التاريخ والجغرافيا";
        }

        if (
            value === "فلسفة" ||
            value === "الفلسفة"
        ) {
            return "الفلسفة";
        }

        if (
            value === "إسلاميات" ||
            value === "الإسلاميات" ||
            value === "العلوم الإسلامية"
        ) {
            return "العلوم الإسلامية";
        }

        if (
            value === "لغة" ||
            value === "لغات" ||
            value === "اللغات"
        ) {
            return "اللغات";
        }

        if (
            value === "إعلام آلي" ||
            value === "الإعلام الآلي" ||
            value === "معلوماتية" ||
            value === "المعلوماتية"
        ) {
            return "الإعلام الآلي";
        }

        if (
            value === "اقتصاد" ||
            value === "الاقتصاد" ||
            value === "محاسبة" ||
            value === "المحاسبة" ||
            value === "الاقتصاد والمحاسبة"
        ) {
            return "الاقتصاد والمحاسبة";
        }

        return value;

    }


    function canDeleteBook(book) {

        if (
            !currentUser ||
            !currentProfile
        ) {
            return false;
        }

        const role =
            currentProfile.role;

        if (role === "programmer") {
            return true;
        }

        if (role === "admin") {
            return true;
        }

        if (role === "teacher") {
            return (
                book.uploaded_by ===
                currentUser.id
            );
        }

        return false;

    }


    async function setupDashboardButton() {

        const backButton =
            document.getElementById(
                "dashboardBackBtn"
            );

        const loginButton =
            document.getElementById(
                "loginBtn"
            );

        try {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth.getUser();

            currentUser =
                user || null;

            if (!user) {

                currentProfile = null;

                backButton.style.display =
                    "none";

                loginButton.style.display =
                    "block";

                return;

            }

            const {
                data: profile,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "full_name, role"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .single();

            if (
                error ||
                !profile
            ) {

                currentProfile = null;

                backButton.style.display =
                    "none";

                loginButton.style.display =
                    "block";

                return;

            }

            currentProfile =
                profile;

            if (
                profile.role ===
                "programmer"
            ) {

                backButton.href =
                    "programmer.html";

                backButton.textContent =
                    "⬅️ لوحة المبرمج";

                backButton.style.display =
                    "inline-block";

                loginButton.style.display =
                    "none";

            }

            else if (
                profile.role ===
                "admin"
            ) {

                backButton.href =
                    "admin.html";

                backButton.textContent =
                    "⬅️ لوحة المدير";

                backButton.style.display =
                    "inline-block";

                loginButton.style.display =
                    "none";

            }

            else if (
                profile.role ===
                "teacher"
            ) {

                backButton.href =
                    "teacher.html";

                backButton.textContent =
                    "⬅️ لوحة الأستاذ";

                backButton.style.display =
                    "inline-block";

                loginButton.style.display =
                    "none";

            }

            else {

                backButton.style.display =
                    "none";

                loginButton.style.display =
                    "block";

            }

        }

        catch (error) {

            console.error(
                "Dashboard button error:",
                error
            );

            currentUser = null;
            currentProfile = null;

            backButton.style.display =
                "none";

            loginButton.style.display =
                "block";

        }

    }


    async function deleteBook(book) {

        if (
            !book ||
            !book.id
        ) {
            return;
        }

        const confirmed =
            window.confirm(

                "⚠️ هل أنت متأكد من حذف الكتاب؟\n\n" +

                "العنوان: " +
                (book.title || "بدون عنوان") +

                "\n\n" +

                "سيتم حذف الكتاب وملف PDF والغلاف نهائيًا."

            );

        if (!confirmed) {
            return;
        }

        try {

            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth.getSession();

            if (!session) {

                alert(
                    "يجب تسجيل الدخول أولًا."
                );

                return;

            }

            if (
                !canDeleteBook(book)
            ) {

                alert(
                    "ليس لديك صلاحية حذف هذا الكتاب."
                );

                return;

            }

            const buttons =
                document.querySelectorAll(
                    ".delete-button"
                );

            let clickedButton = null;

            buttons.forEach(
                function(button) {

                    if (
                        button.dataset.bookId ===
                        String(book.id)
                    ) {

                        clickedButton =
                            button;

                    }

                }
            );

            if (clickedButton) {

                clickedButton.disabled =
                    true;

                clickedButton.textContent =
                    "⏳ جارٍ الحذف...";

            }

            const response =
                await fetch(

                    "/api/books/" +
                    encodeURIComponent(
                        book.id
                    ),

                    {
                        method:
                            "DELETE",

                        headers: {
                            Authorization:
                                "Bearer " +
                                session.access_token
                        }
                    }

                );

            let result;

            try {

                result =
                    await response.json();

            }

            catch (jsonError) {

                result = {
                    success: false,
                    message:
                        "استجاب الخادم برد غير صالح."
                };

            }

            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "تعذر حذف الكتاب."
                );

            }

            booksData =
                booksData.filter(
                    function(item) {

                        return (
                            String(item.id) !==
                            String(book.id)
                        );

                    }
                );

            filterBooks();

            alert(
                "✅ تم حذف الكتاب والغلاف بنجاح."
            );

        }

        catch (error) {

            console.error(
                "Delete book error:",
                error
            );

            alert(
                "❌ تعذر حذف الكتاب.\n\n" +
                (
                    error.message ||
                    "حدث خطأ غير معروف."
                )
            );

            const buttons =
                document.querySelectorAll(
                    ".delete-button"
                );

            buttons.forEach(
                function(button) {

                    if (
                        button.dataset.bookId ===
                        String(book.id)
                    ) {

                        button.disabled =
                            false;

                        button.textContent =
                            "🗑️ حذف الكتاب";

                    }

                }
            );

        }

    }


    function createBookCard(book) {

        const article =
            document.createElement(
                "article"
            );

        article.className =
            "book-card";

        let coverHTML = `

            <div class="book-placeholder">
                📚
            </div>

        `;

        if (
            book.cover_url
        ) {

            coverHTML = `

                <img
                    src="${escapeHTML(
                        book.cover_url
                    )}"
                    alt="غلاف ${escapeHTML(
                        book.title
                    )}"
                    loading="lazy"
                    decoding="async"
                    onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;book-placeholder&quot;>📚</div>'">

            `;

        }

        const readButton = `

            <a
                href="book.html?id=${encodeURIComponent(
                    book.id
                )}"
                class="read-button">

                📖 قراءة الكتاب

            </a>

        `;

        let deleteButton =
            "";

        if (
            canDeleteBook(book)
        ) {

            deleteButton = `

                <button
                    type="button"
                    class="delete-button"
                    data-book-id="${escapeHTML(
                        book.id
                    )}">

                    🗑️ حذف الكتاب

                </button>

            `;

        }

        article.innerHTML = `

            <div class="book-cover">

                ${coverHTML}

            </div>

            <div class="book-info">

                <span class="book-category">

                    ${escapeHTML(
                        normalizeCategory(
                            book.category ||
                            "عام"
                        )
                    )}

                </span>

                <h3>

                    ${escapeHTML(
                        book.title ||
                        "بدون عنوان"
                    )}

                </h3>

                <p>

                    ${escapeHTML(
                        book.description ||
                        "لا يوجد وصف لهذا الكتاب."
                    )}

                </p>

                <p style="
                    color: #64748b;
                    font-size: 14px;
                    margin-top: 8px;
                ">

                    ✍️ ${escapeHTML(
                        book.author ||
                        "مؤلف غير محدد"
                    )}

                </p>

                <div class="book-actions">

                    ${readButton}

                    ${deleteButton}

                </div>

            </div>

        `;

        const deleteButtonElement =
            article.querySelector(
                ".delete-button"
            );

        if (
            deleteButtonElement
        ) {

            deleteButtonElement.addEventListener(
                "click",
                function() {
                    deleteBook(book);
                }
            );

        }

        return article;

    }


    function displayBooks(list) {

        booksContainer.innerHTML =
            "";

        if (
            list.length === 0
        ) {

            resultsCount.textContent =
                "لم يتم العثور على أي كتاب.";

            booksContainer.innerHTML = `

                <div style="
                    grid-column: 1 / -1;
                    text-align: center;
                    padding: 60px 20px;
                    font-size: 20px;
                    color: #64748b;
                ">

                    📚 لا توجد كتب مطابقة للبحث

                </div>

            `;

            return;

        }

        if (
            list.length === 1
        ) {

            resultsCount.textContent =
                "تم العثور على كتاب واحد.";

        }

        else {

            resultsCount.textContent =
                "تم العثور على " +
                list.length +
                " كتب.";

        }

        /*
         * نضيف البطاقات مباشرة.
         * صور الأغلفة يتم تحميلها بشكل منفصل
         * ولن تمنع ظهور البطاقات.
         */

        const fragment =
            document.createDocumentFragment();

        list.forEach(
            function(book) {

                fragment.appendChild(
                    createBookCard(book)
                );

            }
        );

        booksContainer.appendChild(
            fragment
        );

    }


    function filterBooks() {

        const search =
            searchInput.value
                .toLowerCase()
                .trim();

        const params =
            new URLSearchParams(
                window.location.search
            );

        const category =
            params.get("category");

        const normalizedSelectedCategory =
            normalizeCategory(
                category
            );

        const filteredBooks =
            booksData.filter(
                function(book) {

                    const title =
                        (book.title || "")
                            .toLowerCase();

                    const author =
                        (book.author || "")
                            .toLowerCase();

                    const bookCategory =
                        (book.category || "")
                            .toLowerCase();

                    const normalizedBookCategory =
                        normalizeCategory(
                            book.category || ""
                        );

                    const description =
                        (book.description || "")
                            .toLowerCase();

                    const matchesSearch =

                        title.includes(
                            search
                        ) ||

                        author.includes(
                            search
                        ) ||

                        bookCategory.includes(
                            search
                        ) ||

                        normalizedBookCategory
                            .toLowerCase()
                            .includes(
                                search
                            ) ||

                        description.includes(
                            search
                        );

                    const matchesCategory =

                        !normalizedSelectedCategory ||

                        normalizedBookCategory ===
                        normalizedSelectedCategory;

                    return (
                        matchesSearch &&
                        matchesCategory
                    );

                }
            );

        displayBooks(
            filteredBooks
        );

    }


    async function loadBooks() {

        try {

            console.log(
                "📚 بدء تحميل الكتب..."
            );

            const response =
                await fetch(
                    "/api/books",
                    {
                        method: "GET",
                        headers: {
                            "Accept":
                                "application/json"
                        },
                        cache: "no-store"
                    }
                );

            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }

            const result =
                await response.json();

            if (
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "تعذر تحميل الكتب."
                );

            }

            booksData =
                Array.isArray(
                    result.books
                )
                    ? result.books
                    : [];

            console.log(
                "✅ تم تحميل " +
                booksData.length +
                " كتاب"
            );

            filterBooks();

        }

        catch (error) {

            console.error(
                "Books loading error:",
                error
            );

            resultsCount.textContent =
                "";

            booksContainer.innerHTML = `

                <div style="
                    grid-column: 1 / -1;
                    text-align: center;
                    padding: 60px 20px;
                    font-size: 20px;
                    color: #b91c1c;
                ">

                    ❌ تعذر تحميل الكتب من الخادم.

                    <br><br>

                    <span style="
                        font-size: 15px;
                        color: #64748b;
                    ">

                        تأكد من أن الخادم يعمل.

                    </span>

                </div>

            `;

        }

    }


    searchInput.addEventListener(
        "input",
        filterBooks
    );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const searchFromHome =
        params.get("search");

    if (
        searchFromHome
    ) {

        searchInput.value =
            searchFromHome;

    }


    const category =
        params.get("category");

    if (
        category
    ) {

        pageTitle.textContent =
            "كتب " +
            normalizeCategory(
                category
            );

    }


    /*
     * مهم:
     *
     * سابقًا كانت الصفحة تنتظر:
     *
     * setupDashboardButton()
     *
     * ثم:
     *
     * loadBooks()
     *
     * وهذا يؤخر ظهور الكتب.
     *
     * الآن يتم تشغيل الاثنين معًا.
     */

    function initializePage() {

        setupDashboardButton();

        loadBooks();

    }


    initializePage();

</script>

</body>

</html>
