           حالة الخطأ
        ===================================================== */

        .books-error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            font-size: 20px;
            color: #b91c1c;
        }

        .books-error span {
            display: inline-block;
            margin-top: 15px;
            font-size: 15px;
            color: #64748b;
        }


        /* =====================================================
           الشاشات الصغيرة
        ===================================================== */

        @media (max-width: 800px) {

            .dashboard-back-btn {

                font-size: 13px;

            .book-cover {

/* =====================================================

let currentUser = null;

/* =====================================================

let booksData = [];



/* =====================================================
   حماية النصوص من HTML
===================================================== */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;
}



/* =====================================================
   توحيد أسماء التصنيفات
===================================================== */

function normalizeCategory(category) {

    if (!category) {
        return "";
    }


    const value =
        String(category)
            .trim()
            .replace(
                /\s+/g,
                " "
            );


    if (
        value === "رياضيات" ||
        value === "الرياضيات"
    ) {

        return "الرياضيات";
    }


    if (
        value === "علوم" ||
        value === "العلوم" ||
        value === "علم الطبيعة" ||
        value === "العلوم الطبيعية"
    ) {

        return "العلوم الطبيعية";
    }


    if (
        value === "فيزياء" ||
        value === "الفيزياء" ||
        value === "كيمياء" ||
        value === "الكيمياء" ||
        value === "العلوم الفيزيائية"
    ) {

        return "العلوم الفيزيائية";
    }


    if (
        value === "تاريخ" ||
        value === "التاريخ" ||
        value === "جغرافيا" ||
        value === "الجغرافيا" ||
        value === "التاريخ والجغرافيا"
    ) {

        return "التاريخ والجغرافيا";
    }


    if (
        value === "فلسفة" ||
        value === "الفلسفة"
    ) {

        return "الفلسفة";
    }


    if (
        value === "إسلاميات" ||
        value === "الإسلاميات" ||
        value === "العلوم الإسلامية"
    ) {

        return "العلوم الإسلامية";
    }


    if (
        value === "لغة" ||
        value === "لغات" ||
        value === "اللغات"
    ) {

        return "اللغات";
    }


    if (
        value === "إعلام آلي" ||
        value === "الإعلام الآلي" ||
        value === "معلوماتية" ||
        value === "المعلوماتية"
    ) {

        return "الإعلام الآلي";
    }


    if (
        value === "اقتصاد" ||
        value === "الاقتصاد" ||
        value === "محاسبة" ||
        value === "المحاسبة" ||
        value === "الاقتصاد والمحاسبة"
    ) {

        return "الاقتصاد والمحاسبة";
    }


    return value;
}



/* =====================================================
   التحقق من صلاحية حذف الكتاب
===================================================== */

function canDeleteBook(book) {

    if (
        !currentUser ||
        !currentProfile
    ) {

        return false;
    }


    const role =
        currentProfile.role;


    /* المبرمج */

    if (
        role === "programmer"
    ) {

        return true;
    }


    /* المدير */

    if (
        role === "admin"
    ) {

        return true;
    }


    /* الأستاذ */

    if (
        role === "teacher"
    ) {

        return (
            String(book.uploaded_by) ===
            String(currentUser.id)
        );
    }


    return false;
}



/* =====================================================
   إعداد زر لوحة التحكم
===================================================== */

async function setupDashboardButton() {

    const backButton =
        document.getElementById(
            "dashboardBackBtn"
        );


    const loginButton =
        document.getElementById(
            "loginBtn"
        );


    try {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        currentUser =
            user || null;


        /* المستخدم غير مسجل */

        if (!user) {

            currentProfile =
                null;


            backButton.style.display =
                "none";


            loginButton.style.display =
                "block";


            return;
        }



        /* جلب الملف الشخصي */

        const {
            data: profile,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "full_name, role"
                )
                .eq(
                    "id",
                    user.id
                )
                .single();


        if (
            error ||
            !profile
        ) {

            console.warn(
                "تعذر تحميل ملف المستخدم:",
                error
            );


            currentProfile =
                null;


            backButton.style.display =
                "none";


            loginButton.style.display =
                "block";


            return;
        }


        currentProfile =
            profile;



        /* ===============================
           المبرمج
        =============================== */

        if (
            profile.role ===
            "programmer"
        ) {

            backButton.href =
                "programmer.html";


            backButton.textContent =
                "⬅️ لوحة المبرمج";


            backButton.style.display =
                "inline-block";


            loginButton.style.display =
                "none";

        }


        /* ===============================
           المدير
        =============================== */

        else if (
            profile.role ===
            "admin"
        ) {

            backButton.href =
                "admin.html";


            backButton.textContent =
                "⬅️ لوحة المدير";


            backButton.style.display =
                "inline-block";


            loginButton.style.display =
                "none";

        }


        /* ===============================
           الأستاذ
        =============================== */

        else if (
            profile.role ===
            "teacher"
        ) {

            backButton.href =
                "teacher.html";


            backButton.textContent =
                "⬅️ لوحة الأستاذ";


            backButton.style.display =
                "inline-block";


            loginButton.style.display =
                "none";

        }


        /* ===============================
           الطالب
        =============================== */

        else {

            backButton.style.display =
                "none";


            loginButton.style.display =
                "block";

        }

    }

    catch (error) {

        console.error(
            "Dashboard button error:",
            error
        );


        currentUser =
            null;


        currentProfile =
            null;


        backButton.style.display =
            "none";


        loginButton.style.display =
            "block";

    }

}



/* =====================================================
   حذف كتاب
===================================================== */

async function deleteBook(book) {

    if (
        !book ||
        !book.id
    ) {

        return;
    }


    const confirmed =
        window.confirm(

            "⚠️ هل أنت متأكد من حذف الكتاب؟\n\n" +

            "العنوان: " +
            (
                book.title ||
                "بدون عنوان"
            ) +

            "\n\n" +

            "سيتم حذف الكتاب وملف PDF والغلاف نهائيًا."

        );


    if (!confirmed) {
        return;
    }



    try {

        /* الحصول على الجلسة */

        const {
            data: {
                session
            }
        } =
            await supabaseClient
                .auth
                .getSession();


        if (!session) {

            alert(
                "يجب تسجيل الدخول أولًا."
            );

            return;
        }


        /* التحقق من الصلاحية */

        if (
            !canDeleteBook(book)
        ) {

            alert(
                "ليس لديك صلاحية حذف هذا الكتاب."
            );

            return;
        }



        /* ===============================
           العثور على زر الحذف
        =============================== */

        const buttons =
            document.querySelectorAll(
                ".delete-button"
            );


        let clickedButton =
            null;


        buttons.forEach(
            function(button) {

                if (
                    button.dataset.bookId ===
                    String(book.id)
                ) {

                    clickedButton =
                        button;
                }

            }
        );


        if (clickedButton) {

            clickedButton.disabled =
                true;


            clickedButton.textContent =
                "⏳ جارٍ الحذف...";
        }



        /* ===============================
           طلب الحذف
        =============================== */

        const response =
            await fetch(

                "/api/books/" +
                encodeURIComponent(
                    book.id
                ),

                {
                    method:
                        "DELETE",

                    headers: {
                        Authorization:
                            "Bearer " +
                            session.access_token,

                        Accept:
                            "application/json"
                    }
                }

            );



        /* ===============================
           قراءة الاستجابة
        =============================== */

        let result;


        try {

            result =
                await response.json();

        }

        catch (jsonError) {

            console.error(
                "Invalid JSON response:",
                jsonError
            );


            result = {

                success:
                    false,

                message:
                    "استجاب الخادم برد غير صالح."

            };

        }



        /* ===============================
           التحقق من النتيجة
        =============================== */

        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "تعذر حذف الكتاب."
            );

        }



        /* ===============================
           تحديث القائمة
        =============================== */

        booksData =
            booksData.filter(
                function(item) {

                    return (
                        String(item.id) !==
                        String(book.id)
                    );

                }
            );


        filterBooks();


        alert(
            "✅ تم حذف الكتاب والغلاف بنجاح."
        );

    }

    catch (error) {

        console.error(
            "Delete book error:",
            error
        );


        alert(

            "❌ تعذر حذف الكتاب.\n\n" +

            (
                error.message ||
                "حدث خطأ غير معروف."
            )

        );



        /* ===============================
           إعادة الزر لحالته
        =============================== */

        const buttons =
            document.querySelectorAll(
                ".delete-button"
            );


        buttons.forEach(
            function(button) {

                if (
                    button.dataset.bookId ===
                    String(book.id)
                ) {

                    button.disabled =
                        false;


                    button.textContent =
                        "🗑️ حذف الكتاب";

                }

            }
        );

    }

}



/* =====================================================
   إنشاء بطاقة كتاب
===================================================== */

function createBookCard(book) {

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "book-card";



    /* ===============================
       غلاف الكتاب
    =============================== */

    let coverHTML = `

        <div class="book-placeholder">
            📚
        </div>

    `;


    if (
        book.cover_url
    ) {

        const safeCoverURL =
            escapeHTML(
                book.cover_url
            );


        const safeTitle =
            escapeHTML(
                book.title ||
                "بدون عنوان"
            );


        coverHTML = `

            <img
                src="${safeCoverURL}"
                alt="غلاف ${safeTitle}"
                loading="lazy"
                decoding="async"
                onerror="
                    this.style.display='none';
                    this.parentElement.innerHTML='<div class=&quot;book-placeholder&quot;>📚</div>';
                "
            >

        `;

    }



    /* ===============================
       زر القراءة
    =============================== */

    const readButton = `

        <a
            href="book.html?id=${encodeURIComponent(
                book.id
            )}"
            class="read-button">

            📖 قراءة الكتاب

        </a>

    `;



    /* ===============================
       زر الحذف
    =============================== */

    let deleteButton =
        "";


    if (
        canDeleteBook(book)
    ) {

        deleteButton = `

            <button
                type="button"
                class="delete-button"
                data-book-id="${escapeHTML(
                    book.id
                )}">

                🗑️ حذف الكتاب

            </button>

        `;

    }



    /* ===============================
       بيانات الكتاب
    =============================== */

    const category =
        normalizeCategory(
            book.category ||
            "عام"
        );


    const title =
        book.title ||
        "بدون عنوان";


    const description =
        book.description ||
        "لا يوجد وصف لهذا الكتاب.";


    const author =
        book.author ||
        "مؤلف غير محدد";



    /* ===============================
       محتوى البطاقة
    =============================== */

    article.innerHTML = `

        <div class="book-cover">

            ${coverHTML}

        </div>


        <div class="book-info">

            <span class="book-category">

                ${escapeHTML(
                    category
                )}

            </span>


            <h3>

                ${escapeHTML(
                    title
                )}

            </h3>


            <p>

                ${escapeHTML(
                    description
                )}

            </p>


            <p
                style="
                    color: #64748b;
                    font-size: 14px;
                    margin-top: 8px;
                "
            >

                ✍️ ${escapeHTML(
                    author
                )}

            </p>


            <div class="book-actions">

                ${readButton}

                ${deleteButton}

            </div>

        </div>

    `;



    /* ===============================
       حدث الحذف
    =============================== */

    const deleteButtonElement =
        article.querySelector(
            ".delete-button"
        );


    if (
        deleteButtonElement
    ) {

        deleteButtonElement.addEventListener(
            "click",
            function() {

                deleteBook(book);

            }
        );

    }


    return article;
}



/* =====================================================
   عرض الكتب
===================================================== */

function displayBooks(list) {

    booksContainer.innerHTML =
        "";


    /* ===============================
       لا توجد نتائج
    =============================== */

    if (
        !Array.isArray(list) ||
        list.length === 0
    ) {

        resultsCount.textContent =
            "لم يتم العثور على أي كتاب.";


        booksContainer.innerHTML = `

            <div class="no-books">

                📚 لا توجد كتب مطابقة للبحث

            </div>

        `;


        return;
    }



    /* ===============================
       عدد النتائج
    =============================== */

    if (
        list.length === 1
    ) {

        resultsCount.textContent =
            "تم العثور على كتاب واحد.";

    }

    else if (
        list.length === 2
    ) {

        resultsCount.textContent =
            "تم العثور على كتابين.";

    }

    else {

        resultsCount.textContent =
            "تم العثور على " +
            list.length +
            " كتب.";

    }



    /* ===============================
       إنشاء البطاقات
    =============================== */

    const fragment =
        document.createDocumentFragment();


    list.forEach(
        function(book) {

            fragment.appendChild(
                createBookCard(book)
            );

        }
    );


    booksContainer.appendChild(
        fragment
    );

}



/* =====================================================
   فلترة الكتب
===================================================== */

function filterBooks() {

    const search =
        searchInput.value
            .toLowerCase()
            .trim();


    const params =
        new URLSearchParams(
            window.location.search
        );


    const category =
        params.get("category");


    const normalizedSelectedCategory =
        normalizeCategory(
            category
        );



    const filteredBooks =
        booksData.filter(
            function(book) {


                const title =
                    (
                        book.title ||
                        ""
                    )
                    .toLowerCase();


                const author =
                    (
                        book.author ||
                        ""
                    )
                    .toLowerCase();


                const bookCategory =
                    (
                        book.category ||
                        ""
                    )
                    .toLowerCase();


                const normalizedBookCategory =
                    normalizeCategory(
                        book.category ||
                        ""
                    );


                const description =
                    (
                        book.description ||
                        ""
                    )
                    .toLowerCase();



                /* ===============================
                   البحث
                =============================== */

                const matchesSearch =

                    title.includes(
                        search
                    )

                    ||

                    author.includes(
                        search
                    )

                    ||

                    bookCategory.includes(
                        search
                    )

                    ||

                    normalizedBookCategory
                        .toLowerCase()
                        .includes(
                            search
                        )

                    ||

                    description.includes(
                        search
                    );



                /* ===============================
                   التصنيف
                =============================== */

                const matchesCategory =

                    !normalizedSelectedCategory

                    ||

                    normalizedBookCategory ===
                    normalizedSelectedCategory;



                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );



    displayBooks(
        filteredBooks
    );

}



/* =====================================================
   تحميل الكتب من الخادم
===================================================== */

async function loadBooks() {

    try {

        console.log(
            "📚 بدء تحميل الكتب..."
        );


        const response =
            await fetch(
                "/api/books",
                {
                    method:
                        "GET",

                    headers: {
                        Accept:
                            "application/json"
                    },

                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.message ||
                "تعذر تحميل الكتب."
            );

        }


        booksData =
            Array.isArray(
                result.books
            )
                ? result.books
                : [];


        console.log(

            "✅ تم تحميل " +
            booksData.length +
            " كتاب"

        );


        filterBooks();

    }

    catch (error) {

        console.error(
            "Books loading error:",
            error
        );


        resultsCount.textContent =
            "";


        booksContainer.innerHTML = `

            <div class="books-error">

                ❌ تعذر تحميل الكتب من الخادم.

                <br>

                <span>

                    تأكد من أن الخادم يعمل.

                </span>

            </div>

        `;

    }

}



/* =====================================================

searchInput.addEventListener(

async function initializePage() {
